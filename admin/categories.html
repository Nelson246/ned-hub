<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories - NED HUB</title>

    <link rel="stylesheet" href="css/admin.css">

    <style>

        .page-subtitle {
            margin: 6px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        .category-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.05);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 22px;
            border-bottom: 1px solid #e5e7eb;
        }

        .category-header h2 {
            margin: 0;
            font-size: 18px;
            color: #111827;
        }

        .category-count {
            margin-top: 5px;
            color: #64748b;
            font-size: 13px;
        }

        .category-table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .category-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .category-table th {
            background: #f8fafc;
            padding: 14px 16px;
            text-align: left;
            font-size: 12px;
            color: #475569;
            text-transform: uppercase;
            border-bottom: 1px solid #e5e7eb;
        }

        .category-table td {
            padding: 15px 16px;
            border-bottom: 1px solid #eef2f7;
            font-size: 14px;
        }

        .category-table tbody tr:hover {
            background: #f8fafc;
        }

        .product-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 35px;
            padding: 5px 10px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 700;
            font-size: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 7px;
        }

        .edit-category-btn,
        .delete-category-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .edit-category-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .edit-category-btn:hover {
            background: #bfdbfe;
        }

        .delete-category-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .delete-category-btn:hover {
            background: #fecaca;
        }

        /* MODAL */

        .category-modal {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(15, 23, 42, 0.6);

            z-index: 5000;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .category-modal.show {
            display: flex;
        }

        .category-modal-box {
            width: 100%;
            max-width: 500px;

            background: white;

            border-radius: 14px;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);

            overflow: hidden;
        }

        .category-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 20px 24px;

            border-bottom: 1px solid #e5e7eb;
        }

        .category-modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .category-close {
            width: 36px;
            height: 36px;

            border: none;
            border-radius: 50%;

            background: #f1f5f9;

            font-size: 23px;

            cursor: pointer;
        }

        .category-close:hover {
            background: #e2e8f0;
        }

        .category-form {
            padding: 24px;
        }

        .category-form-group {
            margin-bottom: 20px;
        }

        .category-form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;

            color: #374151;
        }

        .category-form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

            box-sizing: border-box;
        }

        .category-form-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .category-form-actions {
            display: flex;
            justify-content: flex-end;

            gap: 10px;

            padding-top: 18px;

            border-top: 1px solid #e5e7eb;
        }

        .category-cancel,
        .category-save {
            border: none;

            padding: 11px 18px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;
        }

        .category-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .category-save {
            background: #2563eb;
            color: white;
        }

        .category-save:hover {
            background: #1d4ed8;
        }

        .empty-category {
            text-align: center;
            padding: 50px 20px !important;
            color: #64748b;
        }

        .loading-category {
            text-align: center;
            padding: 40px !important;
            color: #64748b;
        }

        @media (max-width: 700px) {

            .category-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .action-buttons {
                flex-direction: column;
            }

        }

    </style>
</head>


<body>

<div class="admin-layout">

    <!-- SIDEBAR -->

    <aside
    class="sidebar"
    id="adminSidebar"
></aside>

    <!-- MAIN -->

    <main class="main-content">

        <div class="topbar">

            <div>

                <h1>
                    Categories
                </h1>

                <p class="page-subtitle">
                    Manage your product categories
                </p>

            </div>

            <button
                class="add-product-btn"
                onclick="openAddCategory()"
            >
                + Add Category
            </button>

        </div>


        <!-- CATEGORY LIST -->

        <section class="category-card">

            <div class="category-header">

                <div>

                    <h2>
                        All Categories
                    </h2>

                    <div
                        id="categoryCount"
                        class="category-count"
                    >
                        Loading...
                    </div>

                </div>


                <button
                    class="refresh-btn"
                    onclick="loadCategories()"
                >
                    ↻ Refresh
                </button>

            </div>


            <div class="category-table-wrapper">

                <table class="category-table">

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Products
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="categoriesTable">

                        <tr>

                            <td
                                colspan="4"
                                class="loading-category"
                            >
                                Loading categories...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- CATEGORY MODAL -->

<div
    id="categoryModal"
    class="category-modal"
>

    <div class="category-modal-box">

        <div class="category-modal-header">

            <h2 id="modalTitle">
                Add Category
            </h2>

            <button
                class="category-close"
                onclick="closeCategoryModal()"
            >
                ×
            </button>

        </div>


        <form
            id="categoryForm"
            class="category-form"
        >

            <input
                type="hidden"
                id="categoryId"
            >


            <div class="category-form-group">

                <label>
                    Category Name
                </label>

                <input
                    type="text"
                    id="categoryName"
                    placeholder="Example: Audio & Sound"
                    required
                    autocomplete="off"
                >

            </div>


            <div class="category-form-actions">

                <button
                    type="button"
                    class="category-cancel"
                    onclick="closeCategoryModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="category-save"
                    id="saveCategoryBtn"
                >
                    Save Category
                </button>

            </div>

        </form>

    </div>

</div>


<script>

const API = "/api";


// ==========================================
// OPEN ADD FORM
// ==========================================

function openAddCategory() {

    document.getElementById("modalTitle")
        .textContent = "Add Category";

    document.getElementById("categoryId")
        .value = "";

    document.getElementById("categoryName")
        .value = "";

    document.getElementById("saveCategoryBtn")
        .textContent = "Add Category";

    document.getElementById("categoryModal")
        .classList.add("show");

    setTimeout(() => {

        document.getElementById("categoryName")
            .focus();

    }, 100);

}


// ==========================================
// OPEN EDIT FORM
// ==========================================

function openEditCategory(id, name) {

    document.getElementById("modalTitle")
        .textContent = "Edit Category";

    document.getElementById("categoryId")
        .value = id;

    document.getElementById("categoryName")
        .value = name;

    document.getElementById("saveCategoryBtn")
        .textContent = "Update Category";

    document.getElementById("categoryModal")
        .classList.add("show");

    setTimeout(() => {

        document.getElementById("categoryName")
            .focus();

    }, 100);

}


// ==========================================
// CLOSE MODAL
// ==========================================

function closeCategoryModal() {

    document.getElementById("categoryModal")
        .classList.remove("show");

}


// ==========================================
// LOAD CATEGORIES
// ==========================================

async function loadCategories() {

    const table =
        document.getElementById("categoriesTable");

    const count =
        document.getElementById("categoryCount");


    table.innerHTML = `
        <tr>
            <td colspan="4" class="loading-category">
                Loading categories...
            </td>
        </tr>
    `;


    try {

        const response =
            await fetch(`${API}/categories`, {
                method: "GET",
                credentials: "same-origin"
            });


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Could not load categories."
            );

        }


        const categories =
            Array.isArray(data.categories)
                ? data.categories
                : [];


        count.textContent =
            `${categories.length} ${
                categories.length === 1
                    ? "category"
                    : "categories"
            }`;


        if (categories.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="4" class="empty-category">
                        No categories yet.<br><br>
                        Click <strong>+ Add Category</strong> to create one.
                    </td>
                </tr>
            `;

            return;

        }


        table.innerHTML =
            categories.map(category => {

                const id =
                    Number(category.id);

                const name =
                    escapeHtml(category.name);


                return `

                    <tr>

                        <td>
                            ${id}
                        </td>

                        <td>
                            <strong>
                                ${name}
                            </strong>
                        </td>

                        <td>

                            <span class="product-count">
                                ${Number(category.product_count || 0)}
                            </span>

                        </td>

                        <td>

                            <div class="action-buttons">

                                <button
                                    class="edit-category-btn"
                                    onclick="openEditCategory(
                                        ${id},
                                        '${escapeJs(category.name)}'
                                    )"
                                >
                                    Edit
                                </button>


                                <button
                                    class="delete-category-btn"
                                    onclick="deleteCategory(${id})"
                                >
                                    Delete
                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            }).join("");


    } catch (error) {

        console.error(
            "Category loading error:",
            error
        );


        count.textContent = "Error";


        table.innerHTML = `
            <tr>
                <td colspan="4"
                    class="empty-category"
                    style="color:#dc2626;">
                    Failed to load categories.<br><br>
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

    }

}


// ==========================================
// ADD / UPDATE CATEGORY
// ==========================================

document
    .getElementById("categoryForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const id =
            document.getElementById("categoryId")
                .value.trim();


        const name =
            document.getElementById("categoryName")
                .value.trim();


        if (!name) {

            alert(
                "Please enter a category name."
            );

            return;

        }


        const button =
            document.getElementById("saveCategoryBtn");


        button.disabled = true;

        button.textContent =
            id
                ? "Updating..."
                : "Adding...";


        try {

            let response;


            if (id) {

                response =
                    await fetch(
                        `${API}/categories/${id}`,
                        {
                            method: "PUT",

                            credentials:
                                "same-origin",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name: name
                            })
                        }
                    );

            } else {

                response =
                    await fetch(
                        `${API}/categories`,
                        {
                            method: "POST",

                            credentials:
                                "same-origin",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name: name
                            })
                        }
                    );

            }


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Failed to save category."
                );

            }


            closeCategoryModal();


            await loadCategories();


            alert(
                id
                    ? "Category updated successfully."
                    : "Category added successfully."
            );


        } catch (error) {

            console.error(
                "Save category error:",
                error
            );


            alert(
                error.message ||
                "Failed to save category."
            );


        } finally {

            button.disabled = false;

            button.textContent =
                id
                    ? "Update Category"
                    : "Add Category";

        }

    });


// ==========================================
// DELETE CATEGORY
// ==========================================

async function deleteCategory(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this category?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API}/categories/${id}`,
                {
                    method: "DELETE",
                    credentials: "same-origin"
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to delete category."
            );

        }


        await loadCategories();


        alert(
            "Category deleted successfully."
        );


    } catch (error) {

        console.error(
            "Delete category error:",
            error
        );


        alert(
            error.message ||
            "Failed to delete category."
        );

    }

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==========================================
// ESCAPE JAVASCRIPT
// ==========================================

function escapeJs(value) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\r/g, "\\r")
        .replace(/\n/g, "\\n");

}


// ==========================================
// CLOSE WHEN CLICKING OUTSIDE
// ==========================================

document
    .getElementById("categoryModal")
    .addEventListener("click", function(event) {

        if (event.target === this) {

            closeCategoryModal();

        }

    });


// ==========================================
// ESC KEY
// ==========================================

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closeCategoryModal();

    }

});


// ==========================================
// START
// ==========================================

loadCategories();

</script>

<script src="/admin/js/admin-sidebar.js"></script>

</body>
</html>
