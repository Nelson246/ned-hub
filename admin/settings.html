<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - NED HUB</title>

    <link rel="stylesheet" href="/admin/css/admin.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
        }

        /* ==========================================
           PAGE CONTENT
        ========================================== */

        .settings-page {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .settings-header h1 {
            margin: 0 0 6px;
            font-size: 26px;
            color: #111827;
        }

        .settings-header p {
            margin: 0;
            color: #6b7280;
        }

        /* ==========================================
           SETTINGS GRID
        ========================================== */

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .settings-card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .settings-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            color: #111827;
        }

        .settings-card p {
            color: #6b7280;
        }

        /* ==========================================
           FORM
        ========================================== */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background: white;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0066ff;
            box-shadow: 0 0 0 3px rgba(0,102,255,0.08);
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* ==========================================
           COLORS
        ========================================== */

        .color-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .color-row input[type="color"] {
            width: 65px;
            height: 45px;
            padding: 3px;
            cursor: pointer;
        }

        .color-row input[type="text"] {
            flex: 1;
        }

        /* ==========================================
           BUTTONS
        ========================================== */

        .save-btn {
            border: none;
            background: #0066ff;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .save-btn:hover {
            background: #0052cc;
        }

        .password-btn {
            border: none;
            background: #0b2d5c;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .password-btn:hover {
            background: #174b8c;
        }

        /* ==========================================
           STATUS
        ========================================== */

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .status-message.success {
            display: block;
            background: #e8f7ee;
            color: #18753c;
        }

        .status-message.error {
            display: block;
            background: #fdeaea;
            color: #b42318;
        }

        #passwordMessage {
            margin-top: 15px;
            font-weight: 600;
        }

        /* ==========================================
           SECURITY
        ========================================== */

        .security-card {
            margin-top: 20px;
        }

        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 900px) {

            .settings-page {
                margin-left: 210px;
                width: calc(100% - 210px);
                padding: 20px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {

            .settings-page {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }

            .settings-header {
                align-items: flex-start;
            }

            .color-row {
                flex-direction: column;
                align-items: stretch;
            }

            .color-row input[type="color"] {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- ==========================================
     SHARED ADMIN SIDEBAR
========================================== -->

<aside class="sidebar" id="adminSidebar"></aside>


<!-- ==========================================
     SETTINGS PAGE
========================================== -->

<main class="settings-page">

    <div class="settings-header">

        <div>
            <h1>Store Settings</h1>

            <p>
                Manage your NED HUB store information and branding.
            </p>
        </div>

    </div>


    <div class="settings-grid">


        <!-- ==========================================
             STORE INFORMATION
        ========================================== -->

        <div class="settings-card">

            <h2>Store Information</h2>

            <div class="form-group">

                <label>Store Name</label>

                <input
                    type="text"
                    id="store_name"
                    placeholder="NED HUB"
                >

            </div>


            <div class="form-group">

                <label>Store Tagline</label>

                <input
                    type="text"
                    id="store_tagline"
                    placeholder="Your trusted online shop"
                >

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    id="store_phone"
                    placeholder="+233..."
                >

            </div>


            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="store_email"
                    placeholder="support@example.com"
                >

            </div>


            <div class="form-group">

                <label>Store Address</label>

                <textarea
                    id="store_address"
                    placeholder="Your business address"
                ></textarea>

            </div>


            <button
                class="save-btn"
                onclick="saveStoreInformation()"
            >
                Save Store Information
            </button>

        </div>



        <!-- ==========================================
             BRANDING
        ========================================== -->

        <div class="settings-card">

            <h2>Branding & Colors</h2>


            <div class="form-group">

                <label>Primary Color</label>

                <div class="color-row">

                    <input
                        type="color"
                        id="primary_color"
                        value="#0066ff"
                    >

                    <input
                        type="text"
                        id="primary_color_text"
                        value="#0066ff"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Secondary Color</label>

                <div class="color-row">

                    <input
                        type="color"
                        id="secondary_color"
                        value="#00aaff"
                    >

                    <input
                        type="text"
                        id="secondary_color_text"
                        value="#00aaff"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Accent Color</label>

                <div class="color-row">

                    <input
                        type="color"
                        id="accent_color"
                        value="#ffd700"
                    >

                    <input
                        type="text"
                        id="accent_color_text"
                        value="#ffd700"
                    >

                </div>

            </div>


            <button
                class="save-btn"
                onclick="saveBranding()"
            >
                Save Branding
            </button>

        </div>



        <!-- ==========================================
             SOCIAL MEDIA
        ========================================== -->

        <div class="settings-card">

            <h2>Social Media</h2>


            <div class="form-group">

                <label>Facebook</label>

                <input
                    type="text"
                    id="facebook_url"
                    placeholder="Facebook page URL"
                >

            </div>


            <div class="form-group">

                <label>Instagram</label>

                <input
                    type="text"
                    id="instagram_url"
                    placeholder="Instagram URL"
                >

            </div>


            <div class="form-group">

                <label>TikTok</label>

                <input
                    type="text"
                    id="tiktok_url"
                    placeholder="TikTok URL"
                >

            </div>


            <div class="form-group">

                <label>WhatsApp</label>

                <input
                    type="text"
                    id="whatsapp_number"
                    placeholder="WhatsApp number"
                >

            </div>


            <button
                class="save-btn"
                onclick="saveSocialMedia()"
            >
                Save Social Media
            </button>

        </div>



        <!-- ==========================================
             WEBSITE PREFERENCES
        ========================================== -->

        <div class="settings-card">

            <h2>Website Preferences</h2>


            <div class="form-group">

                <label>Default Theme</label>

                <select id="default_theme">

                    <option value="light">
                        Light
                    </option>

                    <option value="dark">
                        Dark
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Currency</label>

                <select id="currency">

                    <option value="GHS">
                        Ghana Cedi (GHS)
                    </option>

                    <option value="USD">
                        US Dollar (USD)
                    </option>

                </select>

            </div>


            <button
                class="save-btn"
                onclick="saveWebsitePreferences()"
            >
                Save Preferences
            </button>

        </div>

    </div>


    <!-- ==========================================
         STATUS MESSAGE
    ========================================== -->

    <div
        id="statusMessage"
        class="status-message"
    ></div>


    <!-- ==========================================
         SECURITY
    ========================================== -->

    <div class="settings-card security-card">

        <h2>Security</h2>

        <p>
            Change your administrator account password.
        </p>


        <form id="changePasswordForm">

            <div class="form-group">

                <label>Current Password</label>

                <input
                    type="password"
                    id="currentPassword"
                    required
                >

            </div>


            <div class="form-group">

                <label>New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label>Confirm New Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="password-btn"
            >
                Change Password
            </button>


            <div id="passwordMessage"></div>

        </form>

    </div>

</main>



<!-- ==========================================
     SETTINGS JAVASCRIPT
========================================== -->

<script>

let settings = {};


// ==========================================
// LOAD SETTINGS
// ==========================================

async function loadSettings() {

    try {

        const response =
            await fetch("/api/admin/settings");

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.message ||
                "Failed to load settings."
            );

        }


        settings = {};


        data.settings.forEach(setting => {

            settings[setting.setting_name] =
                setting.setting_value;

        });


        // Store information

        document.getElementById("store_name").value =
            settings.store_name || "";

        document.getElementById("store_tagline").value =
            settings.store_tagline || "";

        document.getElementById("store_phone").value =
            settings.store_phone || "";

        document.getElementById("store_email").value =
            settings.store_email || "";

        document.getElementById("store_address").value =
            settings.store_address || "";


        // Colors

        setColor(
            "primary_color",
            settings.primary_color || "#0066ff"
        );

        setColor(
            "secondary_color",
            settings.secondary_color || "#00aaff"
        );

        setColor(
            "accent_color",
            settings.accent_color || "#ffd700"
        );


        // Social media

        document.getElementById("facebook_url").value =
            settings.facebook_url || "";

        document.getElementById("instagram_url").value =
            settings.instagram_url || "";

        document.getElementById("tiktok_url").value =
            settings.tiktok_url || "";

        document.getElementById("whatsapp_number").value =
            settings.whatsapp_number || "";


        // Preferences

        document.getElementById("default_theme").value =
            settings.default_theme || "light";

        document.getElementById("currency").value =
            settings.currency || "GHS";

    }

    catch (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


// ==========================================
// COLOR HANDLING
// ==========================================

function setColor(id, value) {

    const colorInput =
        document.getElementById(id);

    const textInput =
        document.getElementById(id + "_text");

    colorInput.value = value;

    textInput.value = value;

}


// Primary color

document
    .getElementById("primary_color")
    .addEventListener("input", function () {

        document.getElementById(
            "primary_color_text"
        ).value = this.value;

    });


// Secondary color

document
    .getElementById("secondary_color")
    .addEventListener("input", function () {

        document.getElementById(
            "secondary_color_text"
        ).value = this.value;

    });


// Accent color

document
    .getElementById("accent_color")
    .addEventListener("input", function () {

        document.getElementById(
            "accent_color_text"
        ).value = this.value;

    });


// ==========================================
// SAVE ONE SETTING
// ==========================================

async function saveSetting(name, value) {

    const response =
        await fetch(
            "/api/admin/settings/" +
            encodeURIComponent(name),
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    setting_value: value
                })
            }
        );


    const data =
        await response.json();


    if (!data.success) {

        throw new Error(
            data.message ||
            "Failed to save setting."
        );

    }

}


// ==========================================
// STORE INFORMATION
// ==========================================

async function saveStoreInformation() {

    try {

        await saveSetting(
            "store_name",
            document.getElementById("store_name").value
        );


        await saveSetting(
            "store_tagline",
            document.getElementById("store_tagline").value
        );


        await saveSetting(
            "store_phone",
            document.getElementById("store_phone").value
        );


        await saveSetting(
            "store_email",
            document.getElementById("store_email").value
        );


        await saveSetting(
            "store_address",
            document.getElementById("store_address").value
        );


        showMessage(
            "Store information saved successfully.",
            "success"
        );

    }

    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


// ==========================================
// BRANDING
// ==========================================

async function saveBranding() {

    try {

        await saveSetting(
            "primary_color",
            document.getElementById(
                "primary_color_text"
            ).value
        );


        await saveSetting(
            "secondary_color",
            document.getElementById(
                "secondary_color_text"
            ).value
        );


        await saveSetting(
            "accent_color",
            document.getElementById(
                "accent_color_text"
            ).value
        );


        showMessage(
            "Branding settings saved successfully.",
            "success"
        );

    }

    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


// ==========================================
// SOCIAL MEDIA
// ==========================================

async function saveSocialMedia() {

    try {

        await saveSetting(
            "facebook_url",
            document.getElementById(
                "facebook_url"
            ).value
        );


        await saveSetting(
            "instagram_url",
            document.getElementById(
                "instagram_url"
            ).value
        );


        await saveSetting(
            "tiktok_url",
            document.getElementById(
                "tiktok_url"
            ).value
        );


        await saveSetting(
            "whatsapp_number",
            document.getElementById(
                "whatsapp_number"
            ).value
        );


        showMessage(
            "Social media settings saved successfully.",
            "success"
        );

    }

    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


// ==========================================
// WEBSITE PREFERENCES
// ==========================================

async function saveWebsitePreferences() {

    try {

        await saveSetting(
            "default_theme",
            document.getElementById(
                "default_theme"
            ).value
        );


        await saveSetting(
            "currency",
            document.getElementById(
                "currency"
            ).value
        );


        showMessage(
            "Website preferences saved successfully.",
            "success"
        );

    }

    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


// ==========================================
// STATUS MESSAGE
// ==========================================

function showMessage(message, type) {

    const element =
        document.getElementById(
            "statusMessage"
        );


    element.textContent = message;


    element.className =
        "status-message " + type;


    setTimeout(() => {

        element.className =
            "status-message";

    }, 4000);

}


// ==========================================
// CHANGE ADMIN PASSWORD
// ==========================================

document
    .getElementById("changePasswordForm")
    .addEventListener("submit", async function (e) {

        e.preventDefault();


        const currentPassword =
            document.getElementById(
                "currentPassword"
            ).value;


        const newPassword =
            document.getElementById(
                "newPassword"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        const message =
            document.getElementById(
                "passwordMessage"
            );


        message.textContent =
            "Changing password...";

        message.style.color = "#555";


        try {

            const response =
                await fetch(
                    "/api/admin/change-password",
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            currentPassword,
                            newPassword,
                            confirmPassword
                        })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                message.textContent =
                    data.message ||
                    "Failed to change password.";

                message.style.color =
                    "red";

                return;

            }


            message.textContent =
                "Password changed successfully.";

            message.style.color =
                "green";


            document
                .getElementById(
                    "changePasswordForm"
                )
                .reset();

        }

        catch (error) {

            console.error(error);

            message.textContent =
                "Could not connect to the server.";

            message.style.color =
                "red";

        }

    });


// ==========================================
// START
// ==========================================

loadSettings();

</script>


<!-- SHARED ADMIN SIDEBAR -->
<script src="/admin/js/admin-sidebar.js"></script>

</body>
</html>
