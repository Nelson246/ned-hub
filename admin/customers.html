<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NED HUB - Customers</title>

    <!-- SHARED ADMIN CSS -->
    <link rel="stylesheet" href="/admin/css/admin.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 65px;
            background: #0b2d5c;
            color: white;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-left: 250px;
            width: calc(100% - 250px);

            position: relative;
            z-index: 999;
        }

        .header h1 {
            font-size: 21px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.12);
            padding: 9px 14px;
            border-radius: 8px;
            transition: 0.2s ease;
        }

        .back-btn:hover {
            background: #174b8c;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: calc(100% - 250px);
            max-width: none;
            margin: 0 0 0 250px;
            padding: 30px;
        }

        /* =========================
           STATISTICS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 30px;
            font-weight: bold;
        }

        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;

            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .toolbar input,
        .toolbar select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .toolbar input {
            flex: 1;
            min-width: 250px;
        }

        .toolbar input:focus,
        .toolbar select:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* =========================
           CUSTOMER TABLE
        ========================= */

        .table-container {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8fafc;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        tr:hover {
            background: #f9fafb;
        }

        .customer-name {
            font-weight: bold;
        }

        .customer-email {
            color: #555;
            margin-top: 4px;
        }

        .verified {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .unverified {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .money {
            font-weight: bold;
        }

        .view-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            padding: 30px;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 700px;
            margin: 50px auto;
            border-radius: 10px;
            padding: 25px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 22px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #555;
        }

        .close-btn:hover {
            color: #111;
        }

        .customer-details {
            display: grid;
            gap: 15px;
        }

        .detail-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 7px;
        }

        .detail-box strong {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 13px;
        }

        .detail-box span {
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #dc2626;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 900px) {

            .header {
                margin-left: 210px;
                width: calc(100% - 210px);
            }

            .container {
                width: calc(100% - 210px);
                margin-left: 210px;
                padding: 20px;
            }

        }

        @media (max-width: 700px) {

            .header {
                margin-left: 0;
                width: 100%;
                padding: 0 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .back-btn {
                padding: 8px 10px;
                font-size: 13px;
            }

            .container {
                width: 100%;
                margin-left: 0;
                padding: 15px;
            }

            .toolbar {
                padding: 15px;
            }

            .toolbar input {
                min-width: 100%;
            }

            .modal {
                padding: 15px;
            }

            .modal-content {
                margin: 20px auto;
                padding: 20px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         SHARED ADMIN SIDEBAR
    ========================= -->

    <aside class="sidebar" id="adminSidebar"></aside>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>NED HUB - Customers</h1>

        <a href="/admin/" class="back-btn">
            ← Admin Dashboard
        </a>

    </div>


    <!-- =========================
         MAIN
    ========================= -->

    <div class="container">

        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat-card">

                <h3>Total Customers</h3>

                <div
                    class="number"
                    id="totalCustomers"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Verified Customers</h3>

                <div
                    class="number"
                    id="verifiedCustomers"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Unverified Customers</h3>

                <div
                    class="number"
                    id="unverifiedCustomers"
                >
                    0
                </div>

            </div>

        </div>


        <!-- =========================
             SEARCH / FILTER
        ========================= -->

        <div class="toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, email or phone..."
            >


            <select id="verificationFilter">

                <option value="all">
                    All Customers
                </option>

                <option value="verified">
                    Verified
                </option>

                <option value="unverified">
                    Unverified
                </option>

            </select>

        </div>


        <!-- =========================
             CUSTOMER TABLE
        ========================= -->

        <div class="table-container">

            <div
                id="loading"
                class="loading"
            >
                Loading customers...
            </div>


            <table
                id="customersTable"
                style="display:none;"
            >

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Customer</th>

                        <th>Phone</th>

                        <th>Verification</th>

                        <th>Orders</th>

                        <th>Total Spent</th>

                        <th>Registered</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="customersBody"></tbody>

            </table>


            <div
                id="emptyMessage"
                class="empty"
                style="display:none;"
            >
                No customers found.
            </div>

        </div>

    </div>


    <!-- =========================
         CUSTOMER DETAILS MODAL
    ========================= -->

    <div
        id="customerModal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Customer Details
                </h2>


                <button
                    class="close-btn"
                    onclick="closeCustomerModal()"
                    aria-label="Close"
                >
                    &times;
                </button>

            </div>


            <div
                id="customerDetails"
                class="customer-details"
            ></div>

        </div>

    </div>


    <!-- =========================
         CUSTOMER JAVASCRIPT
    ========================= -->

    <script>

        let customers = [];


        // =========================
        // LOAD CUSTOMERS
        // =========================

        async function loadCustomers() {

            const loading =
                document.getElementById("loading");

            const table =
                document.getElementById("customersTable");

            const emptyMessage =
                document.getElementById("emptyMessage");


            try {

                const response =
                    await fetch(
                        "/api/admin/customers",
                        {
                            credentials: "include"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server returned " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Failed to load customers."
                    );

                }


                customers =
                    data.customers || [];


                updateStatistics();

                displayCustomers();


                loading.style.display =
                    "none";


                if (customers.length > 0) {

                    table.style.display =
                        "table";

                } else {

                    emptyMessage.style.display =
                        "block";

                }

            } catch (error) {

                console.error(
                    "Customers error:",
                    error
                );


                loading.innerHTML = `
                    <div class="error">
                        Failed to load customers.
                        <br>
                        <small>
                            ${escapeHtml(
                                error.message || ""
                            )}
                        </small>
                    </div>
                `;

            }

        }


        // =========================
        // UPDATE STATISTICS
        // =========================

        function updateStatistics() {

            const total =
                customers.length;


            let verified = 0;

            let unverified = 0;


            customers.forEach(customer => {

                const value =
                    customer.email_verified;


                if (
                    value === 1 ||
                    value === true ||
                    value === "1" ||
                    value === "true"
                ) {

                    verified++;

                } else {

                    unverified++;

                }

            });


            document.getElementById(
                "totalCustomers"
            ).textContent = total;


            document.getElementById(
                "verifiedCustomers"
            ).textContent = verified;


            document.getElementById(
                "unverifiedCustomers"
            ).textContent = unverified;

        }


        // =========================
        // DISPLAY CUSTOMERS
        // =========================

        function displayCustomers() {

            const tbody =
                document.getElementById(
                    "customersBody"
                );


            const search =
                document.getElementById(
                    "searchInput"
                )
                .value
                .trim()
                .toLowerCase();


            const filter =
                document.getElementById(
                    "verificationFilter"
                ).value;


            const filtered =
                customers.filter(customer => {

                    const name =
                        String(
                            customer.name || ""
                        );


                    const email =
                        String(
                            customer.email || ""
                        );


                    const phone =
                        String(
                            customer.phone || ""
                        );


                    const matchesSearch =
                        name
                            .toLowerCase()
                            .includes(search) ||

                        email
                            .toLowerCase()
                            .includes(search) ||

                        phone
                            .toLowerCase()
                            .includes(search);


                    const isVerified =
                        Number(
                            customer.email_verified
                        ) === 1;


                    let matchesFilter =
                        true;


                    if (
                        filter === "verified"
                    ) {

                        matchesFilter =
                            isVerified;

                    }


                    if (
                        filter === "unverified"
                    ) {

                        matchesFilter =
                            !isVerified;

                    }


                    return (
                        matchesSearch &&
                        matchesFilter
                    );

                });


            tbody.innerHTML = "";


            if (filtered.length === 0) {

                document.getElementById(
                    "emptyMessage"
                ).style.display =
                    "block";


                document.getElementById(
                    "customersTable"
                ).style.display =
                    "none";


                return;

            }


            document.getElementById(
                "emptyMessage"
            ).style.display =
                "none";


            document.getElementById(
                "customersTable"
            ).style.display =
                "table";


            filtered.forEach(customer => {

                const row =
                    document.createElement("tr");


                const verified =
                    Number(
                        customer.email_verified
                    ) === 1;


                const registeredDate =
                    customer.created_at
                        ? new Date(
                            customer.created_at
                        ).toLocaleDateString()
                        : "-";


                const totalSpent =
                    Number(
                        customer.total_spent || 0
                    ).toFixed(2);


                row.innerHTML = `

                    <td>
                        #${escapeHtml(customer.id)}
                    </td>


                    <td>

                        <div class="customer-name">
                            ${escapeHtml(
                                customer.name ||
                                "No name"
                            )}
                        </div>


                        <div class="customer-email">
                            ${escapeHtml(
                                customer.email ||
                                "-"
                            )}
                        </div>

                    </td>


                    <td>
                        ${escapeHtml(
                            customer.phone ||
                            "-"
                        )}
                    </td>


                    <td>

                        ${
                            verified

                            ? `
                                <span class="verified">
                                    Verified
                                </span>
                            `

                            : `
                                <span class="unverified">
                                    Unverified
                                </span>
                            `
                        }

                    </td>


                    <td>
                        ${escapeHtml(
                            customer.order_count ||
                            0
                        )}
                    </td>


                    <td class="money">
                        GHS ${totalSpent}
                    </td>


                    <td>
                        ${escapeHtml(
                            registeredDate
                        )}
                    </td>


                    <td>

                        <button
                            class="view-btn"
                            onclick="viewCustomer(${Number(
                                customer.id
                            )})"
                        >
                            View
                        </button>

                    </td>

                `;


                tbody.appendChild(row);

            });

        }


        // =========================
        // VIEW CUSTOMER
        // =========================

        function viewCustomer(customerId) {

            const customer =
                customers.find(
                    item =>
                        Number(item.id) ===
                        Number(customerId)
                );


            if (!customer) {

                return;

            }


            const verified =
                Number(
                    customer.email_verified
                ) === 1;


            const registeredDate =
                customer.created_at
                    ? new Date(
                        customer.created_at
                    ).toLocaleString()
                    : "-";


            document.getElementById(
                "customerDetails"
            ).innerHTML = `

                <div class="detail-box">

                    <strong>
                        Customer ID
                    </strong>

                    <span>
                        #${escapeHtml(
                            customer.id
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Full Name
                    </strong>

                    <span>
                        ${escapeHtml(
                            customer.name || "-"
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Email
                    </strong>

                    <span>
                        ${escapeHtml(
                            customer.email || "-"
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Phone
                    </strong>

                    <span>
                        ${escapeHtml(
                            customer.phone || "-"
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Email Verification
                    </strong>

                    <span>
                        ${
                            verified
                                ? "Verified"
                                : "Not Verified"
                        }
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Total Orders
                    </strong>

                    <span>
                        ${escapeHtml(
                            customer.order_count ||
                            0
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Total Spent
                    </strong>

                    <span>
                        GHS ${Number(
                            customer.total_spent ||
                            0
                        ).toFixed(2)}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Registered
                    </strong>

                    <span>
                        ${escapeHtml(
                            registeredDate
                        )}
                    </span>

                </div>

            `;


            document.getElementById(
                "customerModal"
            ).style.display =
                "block";

        }


        // =========================
        // CLOSE MODAL
        // =========================

        function closeCustomerModal() {

            document.getElementById(
                "customerModal"
            ).style.display =
                "none";

        }


        // =========================
        // SEARCH
        // =========================

        document.getElementById(
            "searchInput"
        ).addEventListener(
            "input",
            displayCustomers
        );


        // =========================
        // FILTER
        // =========================

        document.getElementById(
            "verificationFilter"
        ).addEventListener(
            "change",
            displayCustomers
        );


        // =========================
        // CLOSE MODAL WHEN CLICKING
        // OUTSIDE
        // =========================

        window.addEventListener(
            "click",
            function(event) {

                const modal =
                    document.getElementById(
                        "customerModal"
                    );


                if (
                    event.target === modal
                ) {

                    closeCustomerModal();

                }

            }
        );


        // =========================
        // ESCAPE KEY
        // =========================

        window.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeCustomerModal();

                }

            }
        );


        // =========================
        // ESCAPE HTML
        // =========================

        function escapeHtml(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // =========================
        // START
        // =========================

        loadCustomers();

    </script>


    <!-- SHARED ADMIN SIDEBAR -->
    <script src="/admin/js/admin-sidebar.js"></script>

</body>

</html>
```
