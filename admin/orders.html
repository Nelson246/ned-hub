<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NED HUB | Admin Orders</title>

    <!-- SHARED ADMIN CSS -->
    <link rel="stylesheet" href="/admin/css/admin.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 65px;

            background: #0b2d5c;

            color: white;

            padding: 0 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-left: 250px;

            width: calc(100% - 250px);

            position: relative;

            z-index: 999;
        }

        header h1 {
            font-size: 21px;
        }

        header a {
            color: white;
            text-decoration: none;

            background: rgba(255,255,255,0.12);

            padding: 9px 14px;

            border-radius: 8px;

            transition: 0.2s ease;
        }

        header a:hover {
            background: #174b8c;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: calc(100% - 250px);

            max-width: none;

            margin: 0 0 0 250px;

            padding: 30px;
        }

        .top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }

        .top h2 {
            font-size: 28px;
        }

        .back-btn {

            background: #1479ff;

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 8px;
        }

        .back-btn:hover {
            background: #0b63d1;
        }

        /* =========================
           FILTERS
        ========================= */

        .filters {

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 25px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.06);

            display: flex;

            gap: 15px;

            flex-wrap: wrap;
        }

        .filters input,
        .filters select {

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 14px;
        }

        .filters input {

            flex: 1;

            min-width: 220px;
        }

        /* =========================
           ORDER STATISTICS
        ========================= */

        .order-stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat-card {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.06);
        }

        .stat-title {

            color: #777;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .stat-number {

            font-size: 25px;

            font-weight: bold;

            color: #071a33;
        }

        /* =========================
           ORDER CARD
        ========================= */

        .order-card {

            background: white;

            border-radius: 12px;

            padding: 22px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.06);
        }

        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom:
                1px solid #eee;

            padding-bottom: 15px;

            margin-bottom: 18px;
        }

        .order-number {

            font-size: 19px;

            font-weight: bold;
        }

        .date {

            color: #777;

            font-size: 13px;

            margin-top: 5px;
        }

        .status {

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            background: #fef3c7;

            color: #92400e;
        }

        .customer {
            margin-bottom: 20px;
        }

        .customer p {

            margin-top: 6px;

            color: #666;
        }

        /* =========================
           INFO
        ========================= */

        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 20px;
        }

        .info-box {

            background: #f7f9fc;

            padding: 15px;

            border-radius: 8px;
        }

        .info-box span {

            display: block;

            color: #777;

            font-size: 12px;

            margin-bottom: 6px;
        }

        .info-box strong {
            font-size: 15px;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products {

            border-top:
                1px solid #eee;

            padding-top: 18px;

            margin-top: 10px;
        }

        .product {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 10px 0;

            border-bottom:
                1px solid #eee;
        }

        .product img {

            width: 55px;

            height: 55px;

            object-fit: cover;

            border-radius: 7px;

            background: #eee;
        }

        .product-info {
            flex: 1;
        }

        .product-info small {

            display: block;

            color: #777;

            margin-top: 5px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .actions {

            margin-top: 20px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .actions select,
        .actions button {

            padding: 10px 14px;

            border-radius: 7px;

            border: 1px solid #ddd;
        }

        .actions select {
            background: white;
        }

        .actions button {

            background: #1479ff;

            color: white;

            border: none;

            cursor: pointer;
        }

        .actions button:hover {
            background: #0b63d1;
        }

        .view-details-btn {

            margin-top: 15px;

            padding: 10px 16px;

            border: none;

            border-radius: 7px;

            background: #071a33;

            color: white;

            cursor: pointer;
        }

        .view-details-btn:hover {
            background: #0d2d55;
        }

        /* =========================
           LOADING / EMPTY / ERROR
        ========================= */

        .loading,
        .empty,
        .error {

            background: white;

            padding: 50px;

            text-align: center;

            border-radius: 12px;
        }

        .error {
            color: #b00020;
        }

        /* =========================
           ORDER MODAL
        ========================= */

        .order-modal {

            display: none;

            position: fixed;

            z-index: 9999;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(0,0,0,0.6);

            padding: 30px 15px;

            overflow-y: auto;
        }

        .order-modal-content {

            background: white;

            width: 100%;

            max-width: 800px;

            margin: 20px auto;

            border-radius: 14px;

            padding: 25px;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.2);
        }

        .order-modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom:
                1px solid #eee;

            padding-bottom: 15px;

            margin-bottom: 20px;
        }

        .close-modal {

            border: none;

            background: #eee;

            width: 35px;

            height: 35px;

            border-radius: 50%;

            font-size: 24px;

            cursor: pointer;
        }

        .close-modal:hover {
            background: #ddd;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {

            .order-stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .info-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 900px) {

            header {

                margin-left: 210px;

                width:
                    calc(100% - 210px);
            }

            .container {

                width:
                    calc(100% - 210px);

                margin-left: 210px;
            }

        }

        @media (max-width: 700px) {

            header {

                margin-left: 0;

                width: 100%;

                padding: 0 15px;
            }

            header h1 {
                font-size: 18px;
            }

            .container {

                width: 100%;

                margin-left: 0;

                padding: 15px;
            }

            .top {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .order-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 10px;
            }

            .info-grid {

                grid-template-columns: 1fr;
            }

            .order-stats {

                grid-template-columns: 1fr;
            }

            .order-modal-content {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     SHARED ADMIN SIDEBAR
========================= -->

<aside
    class="sidebar"
    id="adminSidebar"
></aside>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        NED HUB Admin
    </h1>

    <a href="/admin/">
        ← Dashboard
    </a>

</header>


<!-- =========================
     MAIN
========================= -->

<div class="container">


    <div class="top">

        <h2>
            Orders
        </h2>

        <a
            href="/admin/"
            class="back-btn"
        >
            Dashboard
        </a>

    </div>


    <!-- =========================
         SEARCH / FILTER
    ========================== -->

    <div class="filters">

        <input
            type="text"
            id="search"
            placeholder="Search order number or customer..."
        >

        <select id="statusFilter">

            <option value="">
                All Order Statuses
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="Confirmed">
                Confirmed
            </option>

            <option value="Processing">
                Processing
            </option>

            <option value="Ready">
                Ready
            </option>

            <option value="Shipped">
                Shipped
            </option>

            <option value="Delivered">
                Delivered
            </option>

            <option value="Cancelled">
                Cancelled
            </option>

        </select>

    </div>


    <!-- =========================
         ORDER STATISTICS
    ========================== -->

    <div class="order-stats">

        <div class="stat-card">

            <div class="stat-title">
                Total Orders
            </div>

            <div
                class="stat-number"
                id="totalOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Pending
            </div>

            <div
                class="stat-number"
                id="pendingOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Processing
            </div>

            <div
                class="stat-number"
                id="processingOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Shipped
            </div>

            <div
                class="stat-number"
                id="shippedOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Delivered
            </div>

            <div
                class="stat-number"
                id="deliveredOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Cancelled
            </div>

            <div
                class="stat-number"
                id="cancelledOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Total Sales
            </div>

            <div
                class="stat-number"
                id="totalSales"
            >
                GHS 0.00
            </div>

        </div>

    </div>


    <!-- =========================
         ORDERS
    ========================== -->

    <div id="ordersContainer">

        <div class="loading">
            Loading orders...
        </div>

    </div>

</div>


<!-- =========================
     ORDER DETAILS MODAL
========================== -->

<div
    id="orderModal"
    class="order-modal"
>

    <div class="order-modal-content">

        <div class="order-modal-header">

            <h2>
                Order Details
            </h2>

            <button
                type="button"
                onclick="closeOrderModal()"
                class="close-modal"
            >
                ×
            </button>

        </div>

        <div id="orderModalBody"></div>

    </div>

</div>


<script>

/* =========================
   DATA
========================= */

let allOrders = [];


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );

    try {

        const response =
            await fetch(
                "/api/admin/orders",
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Failed to load orders."
            );

        }


        allOrders =
            data.orders || [];


        updateStatistics();

        displayOrders();


    } catch (error) {

        console.error(
            "Admin orders error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <h3>
                    Could not load orders
                </h3>

                <p style="margin-top:10px;">
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;

    }

}


/* =========================
   UPDATE STATISTICS
========================= */

function updateStatistics() {

    document.getElementById(
        "totalOrders"
    ).textContent =
        allOrders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        allOrders.filter(
            order =>
                order.status === "Pending"
        ).length;


    document.getElementById(
        "processingOrders"
    ).textContent =
        allOrders.filter(
            order =>
                order.status === "Processing"
        ).length;


    document.getElementById(
        "shippedOrders"
    ).textContent =
        allOrders.filter(
            order =>
                order.status === "Shipped"
        ).length;


    document.getElementById(
        "deliveredOrders"
    ).textContent =
        allOrders.filter(
            order =>
                order.status === "Delivered"
        ).length;


    document.getElementById(
        "cancelledOrders"
    ).textContent =
        allOrders.filter(
            order =>
                order.status === "Cancelled"
        ).length;


    const totalSales =
        allOrders.reduce(
            (sum, order) =>
                sum +
                Number(order.total || 0),
            0
        );


    document.getElementById(
        "totalSales"
    ).textContent =
        "GHS " +
        totalSales.toFixed(2);

}


/* =========================
   DISPLAY ORDERS
========================= */

function displayOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    const search =
        document.getElementById(
            "search"
        ).value
        .trim()
        .toLowerCase();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const filtered =
        allOrders.filter(order => {

            const matchesSearch =
                !search ||

                String(order.id)
                    .toLowerCase()
                    .includes(search) ||

                String(
                    order.customer_name || ""
                )
                    .toLowerCase()
                    .includes(search) ||

                String(
                    order.customer_email || ""
                )
                    .toLowerCase()
                    .includes(search);


            const matchesStatus =
                !status ||
                order.status === status;


            return (
                matchesSearch &&
                matchesStatus
            );

        });


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    No orders found
                </h3>

                <p
                    style="
                        margin-top:10px;
                        color:#777;
                    "
                >
                    There are no orders matching your search.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered.map(order => {

            const date =
                order.created_at
                    ? new Date(
                        order.created_at
                    ).toLocaleString("en-GH")
                    : "-";


            const orderStatus =
                escapeHtml(
                    order.status ||
                    "Pending"
                );


            return `

                <div class="order-card">

                    <div class="order-header">

                        <div>

                            <div class="order-number">

                                Order #${escapeHtml(order.id)}

                            </div>

                            <div class="date">

                                ${escapeHtml(date)}

                            </div>

                        </div>


                        <span class="status">

                            ${orderStatus}

                        </span>

                    </div>


                    <div class="customer">

                        <strong>
                            Customer
                        </strong>

                        <p>
                            ${escapeHtml(
                                order.customer_name ||
                                "Unknown customer"
                            )}
                        </p>

                        <p>
                            ${escapeHtml(
                                order.customer_email ||
                                "No email"
                            )}
                        </p>

                        <p>
                            ${escapeHtml(
                                order.customer_phone ||
                                "No phone number"
                            )}
                        </p>

                    </div>


                    <div class="info-grid">


                        <div class="info-box">

                            <span>
                                Order Total
                            </span>

                            <strong>

                                GHS
                                ${Number(
                                    order.total || 0
                                ).toFixed(2)}

                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Delivery Fee
                            </span>

                            <strong>

                                ${
                                    Number(
                                        order.delivery_fee || 0
                                    ) === 0

                                    ? "FREE"

                                    : "GHS " +
                                      Number(
                                          order.delivery_fee
                                      ).toFixed(2)
                                }

                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Payment
                            </span>

                            <strong>
                                ${escapeHtml(
                                    order.payment_status ||
                                    "Pending"
                                )}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Delivery Address
                            </span>

                            <strong>
                                ${escapeHtml(
                                    order.delivery_address ||
                                    "No address"
                                )}
                            </strong>

                        </div>


                    </div>


                    <div class="products">

                        <strong>
                            Products
                        </strong>


                        ${
                            order.items &&
                            order.items.length

                            ? order.items.map(
                                item => `

                                <div class="product">

                                    ${
                                        item.main_image

                                        ? `

                                            <img
                                                src="${escapeHtml(
                                                    item.main_image
                                                )}"
                                                alt="${escapeHtml(
                                                    item.name ||
                                                    "Product"
                                                )}"
                                            >

                                        `

                                        : `

                                            <div
                                                style="
                                                    width:55px;
                                                    height:55px;
                                                    background:#eee;
                                                    border-radius:7px;
                                                    display:flex;
                                                    align-items:center;
                                                    justify-content:center;
                                                    font-size:10px;
                                                "
                                            >
                                                No Image
                                            </div>

                                        `
                                    }


                                    <div class="product-info">

                                        <strong>
                                            ${escapeHtml(
                                                item.name ||
                                                "Product"
                                            )}
                                        </strong>


                                        <small>

                                            ${Number(
                                                item.quantity || 0
                                            )}
                                            ×
                                            GHS
                                            ${Number(
                                                item.price || 0
                                            ).toFixed(2)}

                                        </small>

                                    </div>


                                    <strong>

                                        GHS
                                        ${
                                            (
                                                Number(
                                                    item.price || 0
                                                ) *
                                                Number(
                                                    item.quantity || 0
                                                )
                                            ).toFixed(2)
                                        }

                                    </strong>

                                </div>

                            `).join("")

                            : `

                                <p
                                    style="
                                        margin-top:10px;
                                        color:#777;
                                    "
                                >
                                    No products found.
                                </p>

                            `
                        }

                    </div>


                    <button
                        type="button"
                        class="view-details-btn"
                        onclick="
                            viewOrderDetails(${Number(order.id)})
                        "
                    >
                        View Details
                    </button>


                    <div class="actions">

                        <select
                            id="status-${Number(order.id)}"
                        >

                            <option
                                value="Pending"
                                ${
                                    order.status === "Pending"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Pending
                            </option>


                            <option
                                value="Confirmed"
                                ${
                                    order.status === "Confirmed"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Confirmed
                            </option>


                            <option
                                value="Processing"
                                ${
                                    order.status === "Processing"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Processing
                            </option>


                            <option
                                value="Ready"
                                ${
                                    order.status === "Ready"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Ready
                            </option>


                            <option
                                value="Shipped"
                                ${
                                    order.status === "Shipped"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Shipped
                            </option>


                            <option
                                value="Delivered"
                                ${
                                    order.status === "Delivered"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Delivered
                            </option>


                            <option
                                value="Cancelled"
                                ${
                                    order.status === "Cancelled"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Cancelled
                            </option>

                        </select>


                        <button
                            type="button"
                            onclick="
                                updateOrderStatus(${Number(order.id)})
                            "
                        >
                            Update Status
                        </button>

                    </div>


                </div>

            `;

        }).join("");

}


/* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(orderId) {

    const select =
        document.getElementById(
            `status-${orderId}`
        );


    if (!select) {

        alert(
            "Status selector not found."
        );

        return;

    }


    const status =
        select.value;


    try {

        const response =
            await fetch(
                `/api/admin/orders/${orderId}/status`,
                {
                    method: "PUT",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status
                    })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Failed to update order."
            );

        }


        alert(
            "Order status updated successfully."
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "Update order error:",
            error
        );


        alert(
            error.message
        );

    }

}


/* =========================
   VIEW ORDER DETAILS
========================= */

function viewOrderDetails(orderId) {

    const order =
        allOrders.find(
            order =>
                Number(order.id) ===
                Number(orderId)
        );


    if (!order) {

        alert(
            "Order not found."
        );

        return;

    }


    const modal =
        document.getElementById(
            "orderModal"
        );


    const body =
        document.getElementById(
            "orderModalBody"
        );


    const date =
        order.created_at
            ? new Date(
                order.created_at
            ).toLocaleString("en-GH")
            : "-";


    let productsHTML = "";


    if (
        order.items &&
        order.items.length
    ) {

        productsHTML =
            order.items.map(
                item => {

                    const lineTotal =
                        Number(item.price || 0) *
                        Number(item.quantity || 0);


                    return `

                        <div
                            style="
                                display:flex;
                                align-items:center;
                                gap:15px;
                                padding:12px 0;
                                border-bottom:1px solid #eee;
                            "
                        >

                            ${
                                item.main_image

                                ? `

                                    <img
                                        src="${escapeHtml(
                                            item.main_image
                                        )}"
                                        alt="${escapeHtml(
                                            item.name ||
                                            "Product"
                                        )}"
                                        style="
                                            width:60px;
                                            height:60px;
                                            object-fit:cover;
                                            border-radius:8px;
                                        "
                                    >

                                `

                                : `

                                    <div
                                        style="
                                            width:60px;
                                            height:60px;
                                            background:#eee;
                                            border-radius:8px;
                                            display:flex;
                                            align-items:center;
                                            justify-content:center;
                                            font-size:10px;
                                        "
                                    >
                                        No Image
                                    </div>

                                `
                            }


                            <div
                                style="
                                    flex:1;
                                "
                            >

                                <strong>
                                    ${escapeHtml(
                                        item.name ||
                                        "Product"
                                    )}
                                </strong>


                                <div
                                    style="
                                        color:#777;
                                        margin-top:5px;
                                    "
                                >

                                    ${Number(
                                        item.quantity || 0
                                    )}
                                    ×
                                    GHS
                                    ${Number(
                                        item.price || 0
                                    ).toFixed(2)}

                                </div>

                            </div>


                            <strong>

                                GHS
                                ${lineTotal.toFixed(2)}

                            </strong>

                        </div>

                    `;

                }
            ).join("");

    } else {

        productsHTML = `

            <p style="color:#777;">
                No products found.
            </p>

        `;

    }


    body.innerHTML = `


        <div
            style="
                display:grid;
                grid-template-columns:repeat(2, 1fr);
                gap:15px;
                margin-bottom:25px;
            "
        >


            <div class="info-box">

                <span>
                    Order Number
                </span>

                <strong>
                    #${escapeHtml(order.id)}
                </strong>

            </div>


            <div class="info-box">

                <span>
                    Order Date
                </span>

                <strong>
                    ${escapeHtml(date)}
                </strong>

            </div>


            <div class="info-box">

                <span>
                    Order Status
                </span>

                <strong>
                    ${escapeHtml(
                        order.status ||
                        "Pending"
                    )}
                </strong>

            </div>


            <div class="info-box">

                <span>
                    Payment Status
                </span>

                <strong>
                    ${escapeHtml(
                        order.payment_status ||
                        "Pending"
                    )}
                </strong>

            </div>


        </div>


        <h3
            style="
                margin-bottom:10px;
            "
        >
            Customer
        </h3>


        <div
            class="info-box"
            style="
                margin-bottom:25px;
            "
        >

            <strong>
                ${escapeHtml(
                    order.customer_name ||
                    "Unknown customer"
                )}
            </strong>


            <p
                style="
                    margin-top:7px;
                "
            >
                ${escapeHtml(
                    order.customer_email ||
                    "No email"
                )}
            </p>


            <p
                style="
                    margin-top:7px;
                "
            >
                ${escapeHtml(
                    order.customer_phone ||
                    "No phone number"
                )}
            </p>

        </div>


        <h3
            style="
                margin-bottom:10px;
            "
        >
            Delivery Address
        </h3>


        <div
            class="info-box"
            style="
                margin-bottom:25px;
            "
        >

            ${escapeHtml(
                order.delivery_address ||
                "No address"
            )}

        </div>


        <h3
            style="
                margin-bottom:10px;
            "
        >
            Products
        </h3>


        <div
            style="
                margin-bottom:25px;
            "
        >

            ${productsHTML}

        </div>


        <div
            style="
                border-top:1px solid #eee;
                padding-top:15px;
            "
        >


            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    margin-bottom:10px;
                "
            >

                <span>
                    Delivery Fee
                </span>


                <strong>

                    ${
                        Number(
                            order.delivery_fee || 0
                        ) === 0

                        ? "FREE"

                        : "GHS " +
                          Number(
                              order.delivery_fee
                          ).toFixed(2)
                    }

                </strong>

            </div>


            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    font-size:20px;
                    font-weight:bold;
                "
            >

                <span>
                    Total
                </span>


                <strong>

                    GHS
                    ${Number(
                        order.total || 0
                    ).toFixed(2)}

                </strong>

            </div>


        </div>

    `;


    modal.style.display =
        "block";

}


/* =========================
   CLOSE MODAL
========================= */

function closeOrderModal() {

    document.getElementById(
        "orderModal"
    ).style.display =
        "none";

}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

window.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "orderModal"
            );


        if (
            event.target === modal
        ) {

            closeOrderModal();

        }

    }
);


/* =========================
   ESC KEY CLOSE MODAL
========================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeOrderModal();

        }

    }
);


/* =========================
   SEARCH
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        displayOrders
    );


/* =========================
   STATUS FILTER
========================= */

document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        displayOrders
    );


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   START
========================= */

loadOrders();

</script>
