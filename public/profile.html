<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - NED HUB</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111827;
        }

        header {
            background: #071a33;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4da3ff;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: #1479ff;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1479ff;
        }

        input:disabled {
            background: #f1f1f1;
            color: #777;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background: #1479ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #0965db;
        }

        .save-btn:disabled {
            background: #999;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .success {
            display: block;
            background: #e5ffe9;
            color: #08751c;
        }

        .error {
            display: block;
            background: #ffe5e5;
            color: #c00;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        NED HUB
    </div>

    <a href="/account.html" class="back-btn">
        My Account
    </a>

</header>


<div class="container">

    <div class="profile-box">

        <h1>My Profile</h1>

        <p class="subtitle">
            Manage your personal information.
        </p>

        <div id="loading" class="loading">
            Loading profile...
        </div>

        <div id="profileContent" style="display:none;">

            <div id="message" class="message"></div>

            <form id="profileForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        disabled
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <button
                    type="submit"
                    class="save-btn"
                    id="saveButton"
                >
                    Save Changes
                </button>

            </form>

        </div>

    </div>

</div>


<script>

async function loadProfile() {

    try {

        const response = await fetch("/api/account", {
            credentials: "include"
        });

        const data = await response.json();

        if (!data.success) {

            window.location.href = "/login.html";
            return;

        }

        document.getElementById("name").value =
            data.customer.name || "";

        document.getElementById("email").value =
            data.customer.email || "";

        document.getElementById("phone").value =
            data.customer.phone || "";

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("profileContent").style.display =
            "block";

    } catch (error) {

        console.error(error);

        document.getElementById("loading").textContent =
            "Unable to load your profile.";

    }

}


document.getElementById("profileForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const saveButton =
            document.getElementById("saveButton");

        const message =
            document.getElementById("message");

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {

            const response = await fetch(
                "/api/account/update",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        name: name,
                        phone: phone
                    })
                }
            );

            const data = await response.json();

            message.textContent = data.message;

            if (data.success) {

                message.className =
                    "message success";

            } else {

                message.className =
                    "message error";

            }

        } catch (error) {

            console.error(error);

            message.className =
                "message error";

            message.textContent =
                "Unable to update your profile.";

        }

        saveButton.disabled = false;
        saveButton.textContent = "Save Changes";

    });


loadProfile();

</script>

<script src="/js/site-settings.js"></script>

</body>
</html>
